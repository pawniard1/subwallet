try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>setTimeout(sbar,50))}catch(e){}
function paintAmb(){const el=$("ambEl"),on=st.amb||st.glass,u=urgentNow(),sn=curSeason();
  el.style.setProperty("--ac",u?SIG:sn?SEAS[sn].t:"#7B8CFF");el.style.opacity=on?(u?.5:.38):0}
let pulseT=null;
function syncPulse(){const want=st.sound!==false&&st.pulse===true&&tab==="w"&&st.items.some(s=>!s.off&&days(nextDate(s))===0);
  if(want&&!pulseT)pulseT=setInterval(()=>{if(!document.hidden)snd("pulse")},2600);else if(!want&&pulseT){clearInterval(pulseT);pulseT=null}}
function sync(){document.body.classList.toggle("glass",!!st.glass);paintAmb();sbar();syncPulse()}
// seasonal particles
const fxc=$("fxCv"),fxg=fxc.getContext("2d");let FP=[],fraf=0;
function fxSize(){const d=Math.min(2,devicePixelRatio||1);fxc.width=innerWidth*d;fxc.height=innerHeight*d;fxg.setTransform(d,0,0,d,0,0)}
function fxSeed(){const s=curSeason();FP=[];if(!s)return;for(let i=0;i<(SEAS[s].k==="glint"?14:20);i++)FP.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:2+Math.random()*3.5,v:.25+Math.random()*.45,ph:Math.random()*6.283})}
function fxFrame(t){const s=curSeason();if(!s)return;const S=SEAS[s];fxg.clearRect(0,0,innerWidth,innerHeight);
  const dark=matchMedia("(prefers-color-scheme: dark)").matches||document.documentElement.dataset.theme==="dark";fxg.fillStyle=(S.k==="snow"&&!dark)?"#9EBBE0":S.c;
  for(const p of FP){
    if(S.k==="glint"){fxg.globalAlpha=.1+.35*Math.abs(Math.sin(t/900+p.ph));fxg.beginPath();fxg.arc(p.x,p.y,p.r*.7,0,6.283);fxg.fill();continue}
    p.y+=p.v*(S.k==="snow"?.7:1);p.x+=Math.sin(t/1200+p.ph)*(S.k==="snow"?.25:.55);if(p.y>innerHeight+10){p.y=-10;p.x=Math.random()*innerWidth}
    fxg.globalAlpha=.32;fxg.save();fxg.translate(p.x,p.y);
    if(S.k==="snow"){fxg.beginPath();fxg.arc(0,0,p.r*.6,0,6.283);fxg.fill()}
    else{fxg.rotate(t/900+p.ph);fxg.beginPath();fxg.ellipse(0,0,p.r*(S.k==="leaf"?1.5:1.2),p.r*.7,0,0,6.283);fxg.fill()}
    fxg.restore()}
  fxg.globalAlpha=1;fraf=requestAnimationFrame(fxFrame)}
function fxStart(){cancelAnimationFrame(fraf);fxSize();fxg.clearRect(0,0,innerWidth,innerHeight);fxSeed();if(!curSeason()||rmo)return;fraf=requestAnimationFrame(fxFrame)}
addEventListener("resize",()=>{fxSize();fxSeed()});
// parallax: glow drifts slower than the page
let pq=false;addEventListener("scroll",()=>{if(pq||rmo)return;pq=true;requestAnimationFrame(()=>{pq=false;document.documentElement.style.setProperty("--py",scrollY+"px")})},{passive:true});
// staggered reveal, light sweep, re-fan, saved moment
function stag(sel,step){if(rmo)return;document.querySelectorAll(sel).forEach((e,i)=>{e.style.animation="in .55s var(--spring) backwards";e.style.animationDelay=Math.min(i,14)*(step||45)+"ms"})}
function sweepCard(c){c.classList.remove("sweep");void c.offsetWidth;c.classList.add("sweep");setTimeout(()=>c.classList.remove("sweep"),1000)}
function refan(){nodes.forEach((n,id)=>{n.style.animation="none"});void $("stack").offsetWidth;let i=0;nodes.forEach(n=>{n.style.animation="";n.style.animationDelay=(i++*70)+"ms"})}
function savedMoment(y){snd("saved");hap([20,40,20]);const t=$("toast");t.classList.add("on");clearTimeout(tt);const t0=performance.now();
  const f=n=>{const k=Math.min(1,(n-t0)/800);t.textContent="Saved "+money(y*(1-Math.pow(1-k,3)))+" a year";if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f);tt=setTimeout(()=>t.classList.remove("on"),3200)}
// swipe a card: left = pause, right = cancel?
$("stack").addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"||e.target.closest("button"))return;const c=e.target.closest(".card");if(!c)return;swipe={c,x:e.clientX,y:e.clientY,on:false,armed:false,id:e.pointerId,d:0}});
$("stack").addEventListener("pointermove",e=>{const w=swipe;if(!w||e.pointerId!==w.id)return;const dx=e.clientX-w.x,dy=e.clientY-w.y;
  if(!w.on){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.6){w.on=true;clearTimeout(lp);lp=null;try{w.c.setPointerCapture(e.pointerId)}catch(x){}}else return}
  const d=Math.max(-150,Math.min(150,dx*.85)),c=w.c,s=st.items.find(x=>x.id===c.dataset.id);w.d=d;
  c.style.transition="none";c.style.transform=`translateY(${c.dataset.y}px) translateX(${d}px) rotate(${(d/40).toFixed(2)}deg)`;
  c.dataset.sw=d<0?"l":"r";c.dataset.lbl=d<0?(s&&s.off?"Resume":"Pause"):(s&&s.flag?"Keep it":"Cancel?");c.style.setProperty("--p",Math.min(1,Math.abs(d)/90));
  const ar=Math.abs(d)>=90;if(ar!==w.armed){w.armed=ar;if(ar)hap(10)}});
const endSw=e=>{const w=swipe;if(!w||e.pointerId!==w.id)return;swipe=null;if(!w.on)return;window.__lp=Date.now();const c=w.c,s=st.items.find(x=>x.id===c.dataset.id);
  c.style.transition="";c.style.transform=`translateY(${c.dataset.y}px)`;c.removeAttribute("data-sw");c.style.removeProperty("--p");
  if(e.type==="pointerup"&&w.armed&&s){if(w.d<0)s.off=!s.off;else s.flag=!s.flag;hap(18);save();all()}};
$("stack").addEventListener("pointerup",endSw);$("stack").addEventListener("pointercancel",endSw);
// pull down at the top of the wallet to re-fan the cards
(()=>{let y0=null,dy=0,on=false;const stack=$("stack");
  document.addEventListener("touchstart",e=>{y0=(tab==="w"&&scrollY<=0&&!$("md").classList.contains("on")&&!e.target.closest("input,select,textarea,button,#sp"))?e.touches[0].clientY:null;dy=0;on=false},{passive:true});
  document.addEventListener("touchmove",e=>{if(y0==null||(swipe&&swipe.on))return;dy=e.touches[0].clientY-y0;if(dy>12&&scrollY<=0){on=true;stack.style.transition="none";stack.style.transform=`translateY(${Math.min(90,dy*.4)}px)`}},{passive:true});
  document.addEventListener("touchend",()=>{if(!on){y0=null;return}stack.style.transition="transform .7s var(--spring)";stack.style.transform="";setTimeout(()=>{stack.style.transition=""},750);if(dy>150){refan();snd("shuffle");hap(14)}on=false;y0=null})})();
// settings
$("sndT").checked=st.sound!==false;$("sndT").onchange=e=>{st.sound=e.target.checked;save();if(st.sound)snd("click");sync()};
$("plsT").checked=!!st.pulse;$("plsT").onchange=e=>{st.pulse=e.target.checked;save();syncPulse();if(st.pulse)snd("pulse")};
$("glsT").checked=!!st.glass;$("glsT").onchange=e=>{st.glass=e.target.checked;save();sync()};
$("ambT").checked=!!st.amb;$("ambT").onchange=e=>{st.amb=e.target.checked;save();sync()};
$("sbT").checked=st.sbar!==false;$("sbT").onchange=e=>{st.sbar=e.target.checked;save();sbar()};
$("seaSel").value=st.season||"auto";$("seaSel").onchange=e=>{st.season=e.target.value;save();fxStart();sync()};
// launch splash
setTimeout(()=>{const sp=$("spl");if(!sp)return;sp.classList.add("out");sbar();setTimeout(()=>sp.remove(),600)},1150);
fxStart();all();
</script>
